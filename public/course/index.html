<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>彰基 AI 學習任務</title>
<style>
  :root {
    --bg: #f4f7f8; --card: #ffffff; --ink: #1e293b; --muted: #64748b; --line: #e2e8f0;
    --teal: #0d9488; --teal-d: #115e59; --teal-l: #ccfbf1; --teal-xl: #f0fdfa;
    --amber: #d97706; --amber-l: #fef3c7; --rose: #e11d48; --rose-l: #ffe4e6;
    --done: #16a34a; --done-l: #dcfce7;
    --l1: #0d9488; --l2: #4f46e5; --l3: #ea580c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f172a; --card: #1e293b; --ink: #e2e8f0; --muted: #94a3b8; --line: #334155;
      --teal-l: #134e4a; --teal-xl: #0f2a2a; --amber-l: #422006; --rose-l: #4c0519; --done-l: #14532d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f172a; --card: #1e293b; --ink: #e2e8f0; --muted: #94a3b8; --line: #334155;
    --teal-l: #134e4a; --teal-xl: #0f2a2a; --amber-l: #422006; --rose-l: #4c0519; --done-l: #14532d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; line-height: 1.6; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 80px; }
  .wrap.wide { max-width: 980px; }

  header.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent);
               backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  header.top .wrap { padding-top: 12px; padding-bottom: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 36px; height: 36px; border-radius: 10px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 800;
          background: linear-gradient(150deg, #5eead4, var(--teal)); box-shadow: 0 3px 0 var(--teal-d); cursor: pointer; border: 0; font: inherit; font-weight: 800; }
  h1 { font-size: 18px; margin: 0; }
  .sub { font-size: 12px; color: var(--muted); }
  .prog { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  .bar { flex: 1; height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), #22c55e); transition: width .4s; }
  .prog b { font-size: 13px; min-width: 64px; text-align: right; }

  .intro { margin: 18px 0 8px; padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 14px; }
  .intro ol { margin: 6px 0 0; padding-left: 20px; }

  .level { margin: 26px 0 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .level .tag { color: #fff; font-weight: 800; font-size: 13px; padding: 4px 12px; border-radius: 99px; }
  .level h2 { margin: 0; font-size: 17px; }
  .level span.t { color: var(--muted); font-size: 13px; }

  .task { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin: 10px 0; overflow: hidden;
          box-shadow: 0 3px 0 var(--line); transition: box-shadow .2s, border-color .2s; }
  .task.current { border-color: var(--teal); box-shadow: 0 4px 0 var(--teal), 0 10px 24px -12px rgba(13,148,136,.5); }
  .task.done { opacity: .82; }
  .task > button.head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 0; background: none;
                        color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .num { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 14px;
         border: 2px solid var(--line); color: var(--muted); }
  .task.current .num { border-color: var(--teal); color: var(--teal); }
  .task.done .num { background: var(--done); border-color: var(--done); color: #fff; }
  .head .tt { flex: 1; min-width: 0; }
  .head .tt b { display: block; font-size: 15px; }
  .head .tt small { color: var(--muted); font-size: 12px; }
  .chev { color: var(--muted); transition: transform .2s; }
  .task.open .chev { transform: rotate(90deg); }
  .body { display: none; padding: 0 16px 16px 62px; font-size: 14px; }
  .task.open .body { display: block; }
  @media (max-width: 520px) { .body { padding-left: 16px; } }

  .steps { margin: 0 0 12px; padding-left: 20px; }
  .steps li { margin: 4px 0; }
  .ok { background: var(--teal-xl); border: 1px dashed var(--teal); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin: 10px 0; }
  .ok::before { content: "✅ 完成條件："; font-weight: 700; color: var(--teal-d); }
  :root[data-theme="dark"] .ok::before { color: #5eead4; }
  .warn { background: var(--amber-l); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin: 10px 0; }

  pre.prompt { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
               padding: 12px; font-size: 13px; line-height: 1.55; margin: 8px 0; max-height: 260px; overflow: auto; font-family: inherit; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 14px; font-weight: 700;
         padding: 9px 14px; border-radius: 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { filter: brightness(.97); }
  .btn.pri { background: linear-gradient(160deg, #5eead4, var(--teal)); color: #fff; border-color: transparent; box-shadow: 0 3px 0 var(--teal-d); }
  .btn.pri:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--teal-d); }
  .btn.done { background: linear-gradient(160deg, #86efac, var(--done)); color: #fff; border-color: transparent; box-shadow: 0 3px 0 #166534; margin-left: auto; }
  .task.done .btn.done { background: var(--done-l); color: var(--done); box-shadow: none; }
  .btn.sm { font-size: 13px; padding: 7px 11px; }

  .form { display: grid; gap: 8px; margin: 8px 0; }
  .form label { font-size: 13px; color: var(--muted); }
  .form input, .form textarea, .form select, input.search { width: 100%; font: inherit; font-size: 15px; padding: 9px 11px; border-radius: 10px;
                  border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .check { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; font-size: 14px; }
  .check input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--teal); }

  .tblwrap { overflow-x: auto; margin: 8px 0; }
  table.mini { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.mini th, table.mini td { border: 1px solid var(--line); padding: 6px 8px; text-align: right; white-space: nowrap; }
  table.mini th:first-child, table.mini td:first-child { text-align: left; }
  table.mini th { background: var(--teal-xl); }
  ul.spec { margin: 4px 0 10px; padding-left: 20px; }
  ul.spec li { margin: 3px 0; }
  .red { color: var(--rose); font-weight: 700; }
  .answer { display: none; }
  .answer.show { display: block; }

  /* 課程清單 */
  .group { margin: 26px 0 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .group h2 { margin: 0; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .course { text-align: left; border: 1px solid var(--line); border-left: 5px solid var(--cc, var(--teal)); background: var(--card); color: var(--ink);
            border-radius: 14px; padding: 12px 14px; cursor: pointer; font: inherit; box-shadow: 0 3px 0 var(--line); display: flex; gap: 10px; align-items: flex-start; }
  .course:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--line); }
  .course .ic { font-size: 22px; line-height: 1.2; }
  .course .ct { flex: 1; min-width: 0; }
  .course b { display: block; font-size: 15px; }
  .course small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .course .mini { height: 5px; border-radius: 99px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .course .mini i { display: block; height: 100%; background: var(--done); }
  .course.fin { background: var(--done-l); }
  .chip { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--done); color: #fff; white-space: nowrap; }
  .course.featured { border-width: 2px; border-color: var(--teal); border-left-width: 6px; }
  .back { margin: 16px 0 0; }
  .coursehead { margin: 12px 0 0; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .coursehead h2 { margin: 0 0 4px; font-size: 19px; }

  .finish { margin-top: 28px; text-align: center; background: var(--card); border: 2px solid var(--teal); border-radius: 20px; padding: 24px 16px; }
  .finish.locked { border-style: dashed; border-color: var(--line); color: var(--muted); }
  .cert { display: none; margin: 16px auto 0; max-width: 560px; border: 3px double var(--teal); border-radius: 16px; padding: 22px; background: var(--teal-xl); }
  .cert.show { display: block; }
  .cert h3 { margin: 0 0 6px; font-size: 22px; }
  .cert .name { font-size: 26px; font-weight: 800; margin: 10px 0; color: var(--teal-d); }
  :root[data-theme="dark"] .cert .name { color: #5eead4; }
  .cert .list { font-size: 12px; color: var(--muted); margin-top: 8px; }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(80px); background: #0f172a; color: #fff;
           padding: 10px 16px; border-radius: 12px; font-size: 14px; transition: transform .25s; z-index: 50; max-width: calc(100% - 32px); }
  .toast.show { transform: translateX(-50%) translateY(0); }
  table.guide th, table.guide td { text-align: left !important; vertical-align: top; white-space: normal; min-width: 90px; }
  table.guide .sub { font-size: 12.5px; margin-top: 2px; }
  .qhero { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin-top: 14px; padding: 14px 16px; border-radius: 16px; border: 0; cursor: pointer; font: inherit; color: #fff; background: linear-gradient(135deg, #0f766e, #4f46e5); box-shadow: 0 4px 0 #134e4a; }
  .qhero small { display: block; opacity: .9; font-size: 13px; margin-top: 2px; } .qhero b { font-size: 17px; } .qhero .chip { margin-left: auto; background: #fff; color: #0f766e; white-space: nowrap; }
  .ilformula { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 4px 0 10px; font-size: 13px; }
  .ilformula span { background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 8px; padding: 3px 8px; color: #5b21b6; }
  .ilformula span b { margin-right: 4px; } .ilformula i { font-style: normal; color: var(--muted); }
  .ildl { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; margin: 6px 0; font-size: 12.5px; line-height: 1.5; }
  .ildl dt { font-weight: 800; color: #7c3aed; white-space: nowrap; } .ildl dd { margin: 0; color: var(--ink); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-word; }
  .pack { border: 1.5px dashed #86c49a; background: #f0faf3; border-radius: 14px; padding: 12px 14px; margin: 12px 0 4px; }
  .packfiles { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
  .packfiles span { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-size: 13px; }
  .qtabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
  .qtabs button { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; color: var(--ink); }
  .qtabs button.on { background: var(--teal); border-color: var(--teal); color: #fff; }
  .qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .qcard { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; background: var(--card); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .qgroups button { border-radius: 10px; }
  .qgroups button.on { background: var(--ink); border-color: var(--ink); }
  .qn { font-size: 11px; opacity: .7; margin-left: 2px; }
  .qsub { font-family: inherit; font-size: 11px; font-weight: 700; background: #eef2ff; color: #4338ca; border-radius: 6px; padding: 1px 6px; margin-left: 8px; vertical-align: middle; }
  .qcard .qcode { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 800; font-size: 18px; color: var(--teal-d); }
  .qcard details summary { cursor: pointer; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .qcard .row { margin-top: auto; padding-top: 6px; }
  .modeline { font-size: 13.5px; color: var(--muted); margin: 6px 0; line-height: 1.9; }
  .modebox { border: 1.5px solid #c7d2fe; background: #eef2ff; border-radius: 12px; padding: 10px 12px; margin: 8px 0; font-size: 14px; line-height: 1.6; }
  .modebox > div { margin-top: 4px; }
  .mtag { display: inline-block; font-size: 12px; font-weight: 800; padding: 1px 7px; border-radius: 6px; margin-right: 6px; color: #fff; }
  .mtag.mg { background: #2563eb; } .mtag.mc { background: #10a37f; } .mtag.mn { background: #7c3aed; }
  .modebar { display: flex; gap: 6px; background: var(--line); padding: 4px; border-radius: 12px; }
  .modebar button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 700; font-size: 14px; padding: 8px; border-radius: 9px; cursor: pointer; line-height: 1.35; }
  .modebar button.on { background: var(--card); color: var(--teal-d); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea, select, pre.prompt { -webkit-user-select: text; user-select: text; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 30px; }

  @media print {
    header.top, .intro, .level, .task, footer, .group, .grid, .back, .coursehead, input.search, .finish > :not(.cert) { display: none !important; }
    .finish { border: 0; padding: 0; }
    .cert { display: block !important; }
    body { background: #fff; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap" id="hdrWrap">
    <div class="brand">
      <button class="logo" onclick="go('')" title="回到範例清單">AI</button>
      <div style="min-width:0">
        <h1 id="hdrTitle">彰基 AI 學習任務</h1>
        <div class="sub" id="hdrSub">逐項完成即可・不需安裝・用自己的 Google 帳號</div>
      </div>
    </div>
    <div class="prog"><div class="bar"><i id="barFill"></i></div><b id="progText">0 / 40</b></div>
  </div>
</header>

<main class="wrap" id="view"></main>
