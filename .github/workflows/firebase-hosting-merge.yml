# 推送到 main 後自動部署到 Firebase Hosting（sign-in-4a9b6.web.app）
name: Deploy to Firebase Hosting on push
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SIGN_IN_4A9B6 }}
          channelId: live
          projectId: sign-in-4a9b6
